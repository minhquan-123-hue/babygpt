<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BabyGPT Lab</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
<header>
  <div>
    <span class="eyebrow">BABYGPT LAB</span>
    <h1>Watch the model generate.</h1>
    <p>Real backend inference. The visualizations are a window into the computation.</p>
  </div>
  <button id="run">Generate</button>
</header>
<section class="prompt">
  <label for="prompt">Prompt</label>
  <input id="prompt" value="tôi" autocomplete="off">
</section>
<section class="panel">
  <div class="panel-head"><h2>01 · Text</h2><span id="text-status">waiting</span></div>
  <div id="neural-net" class="neural-net"></div>
  <pre id="text-output"></pre>
</section>
<section class="panel">
  <div class="panel-head"><h2>02 · Audio · 3 seconds</h2><span id="audio-status">waiting</span></div>
  <div id="wave" class="wave"></div>
  <audio id="audio" controls></audio>
</section>
<section class="panel">
  <div class="panel-head"><h2>03 · Image · 32 × 32</h2><span id="image-status">waiting</span></div>
  <div class="image-layout">
    <img id="image" alt="Generated 32 by 32 image">
    <div id="grid" class="grid"></div>
  </div>
</section>
</main>
<script src="/app.js"></script>
</body>
</html>
